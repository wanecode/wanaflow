name: wanaflow

services:
  postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_DB: wanaflow
      POSTGRES_USER: wanaflow
      POSTGRES_PASSWORD: wanaflow
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wanaflow -d wanaflow"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - wanaflow-postgres:/var/lib/postgresql/18/docker

volumes:
  wanaflow-postgres:
