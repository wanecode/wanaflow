name: wanaflow-test

services:
  postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_DB: wanaflow_test
      POSTGRES_USER: wanaflow
      POSTGRES_PASSWORD: wanaflow_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wanaflow -d wanaflow_test"]
      interval: 1s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/18/docker
